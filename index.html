<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS Balanças - Sistema de Cotações</title>
    <link rel="stylesheet" href="style.css">
    <!-- Biblioteca para PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <!-- Bootstrap para tabelas responsivas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <!-- Cabeçalho -->
        <header class="header-bar">
            <h1>⚖️ SOS BALANÇAS</h1>
            <p class="subtitle">Sistema de Cotações - Modelo Grascon</p>
        </header>

        <div class="row">
            <!-- Coluna Esquerda: Formulário -->
            <div class="col-md-5">
                <div class="form-container">
                    <!-- Dados da Empresa Cliente -->
                    <section class="form-section">
                        <h2><span class="step">1</span> Dados do Cliente</h2>
                        
                        <div class="mb-3">
                            <label class="form-label">Consultar por CNPJ:</label>
                            <div class="input-group">
                                <input type="text" id="cnpjConsulta" class="form-control" placeholder="00.000.000/0000-00">
                                <button class="btn btn-primary" onclick="consultarCNPJ()">
                                    <i class="bi bi-search"></i> Consultar
                                </button>
                            </div>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label">Razão Social *</label>
                                <input type="text" id="razaoSocial" class="form-control" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">CNPJ *</label>
                                <input type="text" id="cnpj" class="form-control" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">Contato *</label>
                                <input type="text" id="contato" class="form-control" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">Telefone *</label>
                                <input type="text" id="telefone" class="form-control" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">E-mail *</label>
                                <input type="text" id="email" class="form-control" required>
                            </div>
                            
                            <div class="col-md-12">
                                <label class="form-label">Endereço</label>
                                <input type="text" id="endereco" class="form-control">
                            </div>
                        </div>
                    </section>

                    <!-- Produtos -->
                    <section class="form-section">
                        <h2><span class="step">2</span> Produtos</h2>
                        
                        <div class="mb-3">
                            <label class="form-label">Selecionar Produto:</label>
                            <div class="input-group">
                                <select id="produtoSelect" class="form-select" onchange="previewProduto()">
                                    <option value="">Selecione um produto...</option>
                                </select>
                                <button class="btn btn-secondary" onclick="carregarCatalogo()">
                                    <i class="bi bi-arrow-clockwise"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Preview do Produto -->
                        <div id="produtoPreview" class="produto-preview hidden">
                            <div class="row align-items-center">
                                <div class="col-md-4">
                                    <img id="previewImagem" src="" class="img-thumbnail">
                                </div>
                                <div class="col-md-8">
                                    <h5 id="previewNome"></h5>
                                    <p id="previewEspecificacoes" class="small text-muted"></p>
                                    <p id="previewPreco" class="fw-bold"></p>
                                    <button onclick="adicionarProduto()" class="btn btn-success btn-sm">
                                        <i class="bi bi-plus-circle"></i> Adicionar à Cotação
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Itens da Cotação -->
                        <div class="mt-4">
                            <h5>Itens da Cotação:</h5>
                            <div id="itensContainer" class="itens-container">
                                <!-- Itens serão adicionados aqui -->
                            </div>
                            
                            <div class="total-container">
                                <h4>Total: <span id="totalGeral">R$ 0,00</span></h4>
                            </div>
                        </div>
                    </section>

                    <!-- Condições Comerciais -->
                    <section class="form-section">
                        <h2><span class="step">3</span> Condições Comerciais</h2>
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Forma de Pagamento</label>
                                <select id="pagamento" class="form-select">
                                    <option>Boleto bancário</option>
                                    <option>Cartão de crédito</option>
                                    <option>PIX</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">Prazo</label>
                                <input type="text" id="prazo" class="form-control" value="28/35ddl">
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">Frete</label>
                                <input type="text" id="frete" class="form-control" value="CIF para São Paulo - Capital">
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">Garantia</label>
                                <input type="text" id="garantia" class="form-control" value="01 ano">
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">Disponibilidade</label>
                                <input type="text" id="disponibilidade" class="form-control" value="Em estoque">
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">Validade</label>
                                <input type="text" id="validade" class="form-control" value="30 dias">
                            </div>
                        </div>
                    </section>

                    <!-- Botões de Ação -->
                    <div class="action-buttons">
                        <button onclick="gerarCotacao()" class="btn btn-primary btn-lg">
                            <i class="bi bi-file-earmark-pdf"></i> Gerar Cotação em PDF
                        </button>
                        <button onclick="limparTudo()" class="btn btn-outline-secondary btn-lg">
                            <i class="bi bi-trash"></i> Limpar Tudo
                        </button>
                    </div>
                </div>
            </div>

            <!-- Coluna Direita: Preview da Cotação -->
            <div class="col-md-7">
                <div class="preview-container">
                    <h2 class="preview-title">📄 Preview da Cotação</h2>
                    <div class="cotacao-preview" id="cotacaoPreview">
                        <!-- Template da cotação será gerado aqui -->
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>SOS Balanças - Sistema de Cotações | CNPJ: 03.670.008/0001-53</p>
            <p>Contato: (11) 5677-5807 | Email: elisangela@grascon.com.br</p>
        </footer>
    </div>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    
    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
