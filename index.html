<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cotações - Grascon</title>
    <link rel="stylesheet" href="style.css">
    <!-- Biblioteca para PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<header>
    <div class="logo">
        <h1>⚖️ SOS BALANÇAS</h1>
        <p>30 anos de experiência e tradição</p>
    </div>
    <div class="contato-header">
        <p>📞 (11) 94712-0499 | 📧 contato@sosbalanca.com.br</p>
    </div>
</header>
        <!-- Seção CNPJ -->
        <section class="section">
    <h2>1. Dados da Empresa Cliente</h2>
    <div class="input-group">
        <label for="cnpj">CNPJ:</label>
        <input type="text" id="cnpj" placeholder="00.000.000/0000-00">
        <button onclick="consultarCNPJ()" class="btn">🔍 Consultar CNPJ</button>
    </div>
    
    <div class="grid-2-col">
        <div>
            <label for="razaoSocialInput">Razão Social:</label>
            <input type="text" id="razaoSocialInput" placeholder="Digite a razão social">
        </div>
        <div>
            <label for="cnpjInput">CNPJ:</label>
            <input type="text" id="cnpjInput" placeholder="Digite o CNPJ">
        </div>
        <div>
            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" placeholder="Digite o endereço completo">
        </div>
        <div>
            <label for="contato">Contato:</label>
            <input type="text" id="contato" placeholder="Nome do contato">
        </div>
        <div>
            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" placeholder="(00) 0000-0000">
        </div>
        <div>
            <label for="email">E-mail:</label>
            <input type="text" id="email" placeholder="email@empresa.com">
        </div>
    </div>
</section>

            <!-- Tabela de Itens -->
            <table id="tabelaItens" class="table">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Valor Unit.</th>
                        <th>Total</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="itensCorpo">
                    <!-- Itens serão inseridos aqui -->
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="4" style="text-align: right;"><strong>Total Geral:</strong></td>
                        <td id="totalGeral">R$ 0,00</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </section>

        <!-- Seção Condições -->
       <section class="section">
    <h2>3. Condições Comerciais</h2>
    <div class="grid-3-col">
        <div>
            <label>Forma de Pagamento:</label>
            <select id="pagamento">
                <option>Boleto bancário</option>
                <option>Cartão de crédito</option>
                <option>PIX</option>
                <option>Transferência bancária</option>
            </select>
        </div>
        <div>
            <label>Prazo de Entrega:</label>
            <input type="text" id="prazo" value="28/35ddl">
        </div>
        <div>
            <label>Frete:</label>
            <input type="text" id="frete" value="CIF para São Paulo - Capital">
        </div>
        <div>
            <label>Garantia:</label>
            <input type="text" id="garantia" value="01 ano">
        </div>
        <div>
            <label>Validade da Proposta:</label>
            <input type="text" id="validade" value="30 dias">
        </div>
        <div>
            <label>Disponibilidade:</label>
            <input type="text" id="disponibilidade" value="Em estoque">
        </div>
    </div>
</section>

        <!-- Botões de Ação -->
        <div class="actions">
            <button onclick="gerarPDF()" class="btn primary">📄 Gerar PDF</button>
            <button onclick="limparCotacao()" class="btn secondary">🗑️ Limpar Tudo</button>
        </div>

        <!-- Preview da Cotação -->
        <div id="previewCotacao" class="preview hidden">
            <h3>Preview da Cotação</h3>
            <div id="conteudoPDF">
                <!-- Conteúdo será gerado aqui -->
            </div>
        </div>
    </div>

    <footer>
        <p>© 2025 - SOS Balanças</p>
        <p>Seu site: <span id="siteUrl">carregando...</span></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
